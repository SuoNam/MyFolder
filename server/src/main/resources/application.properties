spring.application.name=MyFolder_Sever

# OpenAPI: /v3/api-docs, Swagger UI: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
server.port=${MYFOLDER_SERVER_PORT:8081}
spring.profiles.active=${MYFOLDER_PROFILE:development}
spring.session.store-type=none
jwt.expiration=${MYFOLDER_JWT_EXPIRATION:2h}
jwt.secret=${MYFOLDER_JWT_SECRET}

# Authentication v2. Existing databases are baselined at v1, then upgraded
# without dropping legacy accounts.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
auth.web-refresh-ttl=${MYFOLDER_WEB_REFRESH_TTL:30d}
auth.desktop-refresh-ttl=${MYFOLDER_DESKTOP_REFRESH_TTL:3650d}
auth.verification-code-ttl=${MYFOLDER_VERIFICATION_CODE_TTL:10m}
auth.verification-resend-delay=${MYFOLDER_VERIFICATION_RESEND_DELAY:60s}
auth.resend.api-key=${MYFOLDER_RESEND_API_KEY:}
auth.resend.from=${MYFOLDER_RESEND_FROM:MyFolder <no-reply@mail.myfolder.com.cn>}
auth.public-base-url=${MYFOLDER_PUBLIC_API_URL:https://api.myfolder.com.cn}
auth.web-base-url=${MYFOLDER_WEB_URL:https://web.myfolder.com.cn}
auth.oauth.google.client-id=${MYFOLDER_OAUTH_GOOGLE_CLIENT_ID:}
auth.oauth.google.client-secret=${MYFOLDER_OAUTH_GOOGLE_CLIENT_SECRET:}
auth.oauth.google.proxy-host=${MYFOLDER_OAUTH_GOOGLE_PROXY_HOST:}
auth.oauth.google.proxy-port=${MYFOLDER_OAUTH_GOOGLE_PROXY_PORT:0}
auth.super-admin-accounts=${MYFOLDER_SUPER_ADMIN_ACCOUNTS:}
auth.oauth.github.client-id=${MYFOLDER_OAUTH_GITHUB_CLIENT_ID:}
auth.oauth.github.client-secret=${MYFOLDER_OAUTH_GITHUB_CLIENT_SECRET:}
auth.oauth.github.proxy-host=${MYFOLDER_OAUTH_GITHUB_PROXY_HOST:${MYFOLDER_OAUTH_GOOGLE_PROXY_HOST:}}
auth.oauth.github.proxy-port=${MYFOLDER_OAUTH_GITHUB_PROXY_PORT:${MYFOLDER_OAUTH_GOOGLE_PROXY_PORT:0}}
auth.oauth.nyauth.client-id=${MYFOLDER_OAUTH_NYAUTH_CLIENT_ID:}
auth.oauth.nyauth.client-secret=${MYFOLDER_OAUTH_NYAUTH_CLIENT_SECRET:}

# v1 resumable transfer storage. Override in each deployment profile when needed.
transfer.storage-root=${basePath}
transfer.metadata-root=${MYFOLDER_TRANSFER_METADATA_ROOT:${transfer.storage-root}/.myfolder/upload-tasks}
device.metadata-file=${MYFOLDER_DEVICE_METADATA_FILE:${transfer.storage-root}/.myfolder/devices.json}
forward.metadata-file=${MYFOLDER_FORWARD_METADATA_FILE:${transfer.storage-root}/.myfolder/forwards.json}

logging.level.root=${MYFOLDER_LOG_LEVEL:info}
logging.level.xyz.suonan.myfolder_sever.Controller.FileHttpController=warn
logging.file.name=${MYFOLDER_LOG_FILE:logs/myapp.log}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
