spring.datasource.url=${MYFOLDER_DB_URL}
spring.datasource.username=${MYFOLDER_DB_USERNAME}
spring.datasource.password=${MYFOLDER_DB_PASSWORD}
basePath=${MYFOLDER_STORAGE_ROOT}

server.port=${MYFOLDER_SERVER_PORT:8082}
server.address=${MYFOLDER_SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

# Production is TLS-by-default. A deployment that terminates TLS at a trusted
# reverse proxy must explicitly set MYFOLDER_TLS_ENABLED=false and bind this
# application port to loopback or a private network address.
server.ssl.enabled=${MYFOLDER_TLS_ENABLED:true}
server.ssl.key-store=${MYFOLDER_TLS_KEY_STORE:}
server.ssl.key-store-password=${MYFOLDER_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${MYFOLDER_TLS_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${MYFOLDER_TLS_KEY_ALIAS:myfolder}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.http2.enabled=${MYFOLDER_HTTP2_ENABLED:true}
spring.data.redis.host=${MYFOLDER_REDIS_HOST}
spring.data.redis.port=${MYFOLDER_REDIS_PORT:6379}
spring.data.redis.username=${MYFOLDER_REDIS_USERNAME:}
spring.data.redis.password=${MYFOLDER_REDIS_PASSWORD}
