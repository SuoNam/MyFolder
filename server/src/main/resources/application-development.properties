spring.datasource.url=${MYFOLDER_DB_URL:jdbc:mysql://localhost:3306/myfolder_development?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${MYFOLDER_DB_USERNAME:myfolder}
spring.datasource.password=${MYFOLDER_DB_PASSWORD:}
basePath=${MYFOLDER_STORAGE_ROOT:${user.home}/.myfolder/storage}

server.port=${MYFOLDER_SERVER_PORT:8082}
spring.data.redis.host=${MYFOLDER_REDIS_HOST:localhost}
spring.data.redis.port=${MYFOLDER_REDIS_PORT:6379}
spring.data.redis.username=${MYFOLDER_REDIS_USERNAME:}
spring.data.redis.password=${MYFOLDER_REDIS_PASSWORD:}
